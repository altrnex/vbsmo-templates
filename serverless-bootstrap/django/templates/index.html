{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A little hello</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>
  <body>
    <main class="min-h-screen bg-stone-50 px-5 py-16 text-stone-900">
      <section class="mx-auto max-w-xl rounded-2xl border border-stone-200 bg-white p-8 shadow-sm">
        <p class="text-sm font-medium text-teal-700">Let's get acquainted</p>
        <h1 class="mt-2 text-3xl font-semibold tracking-tight">A little hello, just for you</h1>
        <p class="mt-3 text-stone-600">Send your name to the API and get a greeting.</p>
        <form id="greeting-form"
              data-vbsmo-route="hello.submit"
              class="mt-8 space-y-5">
          <label class="block text-sm font-medium" for="greeting-name">
            Your name
            <input id="greeting-name"
                   name="name"
                   autocomplete="given-name"
                   required
                   maxlength="80"
                   class="mt-2 block w-full rounded-lg border border-stone-300 px-3 py-2">
          </label>
          <button type="submit" disabled
                  class="rounded-lg bg-teal-700 px-5 py-2.5 font-medium text-white hover:bg-teal-800 disabled:opacity-50">
            Say hello
          </button>
        </form>
        <div id="greeting-result"
             role="status"
             aria-live="polite"
             class="mt-6 whitespace-pre-line rounded-lg bg-stone-50 p-4 text-sm empty:hidden">
        </div>
        <p class="mt-4 text-xs text-stone-500">
          This demo responds immediately. It doesn't save your details.
        </p>
      </section>
    </main>
    <script type="module" src="{% static 'js/greeting.js' %}"></script>
  </body>
</html>
