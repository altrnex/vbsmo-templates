services:
  app:
    build:
      context: .
      secrets: [app_env]
    env_file: .env.production
    restart: unless-stopped
    environment:
      VBSMO_HOSTNAME: ${VBSMO_HOSTNAME:?Set VBSMO_HOSTNAME}
      PGHOST: postgres
      PGDATABASE: vbsmo_app
      PGUSER: vbsmo_app
      PGPASSWORD: ${VBSMO_DB_PASSWORD:?Set a hexadecimal database password}
      MEDIA_ROOT: /data/media
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${VBSMO_DATA_DIR:?Set VBSMO_DATA_DIR to the mounted data disk}/app:/data
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vbsmo_app
      POSTGRES_USER: vbsmo_app
      POSTGRES_PASSWORD: ${VBSMO_DB_PASSWORD:?Set a hexadecimal database password}
    volumes:
      - ${VBSMO_DATA_DIR:?Set VBSMO_DATA_DIR to the mounted data disk}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbsmo_app -d vbsmo_app"]
      interval: 5s
      retries: 10
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      VBSMO_HOSTNAME: ${VBSMO_HOSTNAME:?Set VBSMO_HOSTNAME}
      VBSMO_TLS: ${VBSMO_TLS:-public}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${VBSMO_DATA_DIR:?Set VBSMO_DATA_DIR to the mounted data disk}/caddy:/data
secrets:
  app_env:
    file: .env.production
