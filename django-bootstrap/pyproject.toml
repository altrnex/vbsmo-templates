[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".git", ".venv", "__pycache__", "staticfiles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 100
format_css = false
format_js = false
exclude = ".git,.venv,node_modules,staticfiles"
