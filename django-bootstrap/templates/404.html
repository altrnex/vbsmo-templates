{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The requested page could not be found.">
    <title>Page not found</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>
  <body class="min-h-screen antialiased">
    <main class="mx-auto flex min-h-screen w-full items-center px-6 py-20">
      <div class="space-y-5">
        <p class="font-medium">404</p>
        <h1 class="font-semibold">Page not found.</h1>
        <p>The page may have moved or the address may be incorrect.</p>
        <a class="inline-flex font-medium underline underline-offset-4"
           href="{% url 'home' %}">Return home</a>
      </div>
    </main>
  </body>
</html>
