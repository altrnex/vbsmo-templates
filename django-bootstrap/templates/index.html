{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A new Django site ready to be shaped.">
    <title>New Django site</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-950 antialiased">
    <main class="mx-auto flex min-h-screen w-full max-w-3xl items-center px-6 py-20">
      <div class="space-y-5">
        <p class="flex items-center gap-2 text-sm font-medium tracking-wide text-stone-500">
          <span class="size-4" aria-hidden="true">{% include "icons/check.svg" %}</span>
          Django
        </p>
        <h1 class="text-4xl font-semibold tracking-tight sm:text-5xl">A clean place to begin.</h1>
        <p class="max-w-xl text-lg leading-8 text-stone-600">
          The application is ready for its first page, reusable templates, and content.
        </p>
      </div>
    </main>
  </body>
</html>
